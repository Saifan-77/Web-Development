<!DOCTYPE html>
<html>
    <head>
        <title>HTML Link</title>
    </head>
    <body>
        <h1>HTML Link</h1>
        <a href="https://www.daraz.com.bd/#?">Visit Daraz!</a>
        <h1>Table</h1>
        <table border="2">
            <tr bgcolor="Green"> 
             <th>Student ID</th>
             <th>Student Name</th>
             <th>Blood Group</th>
            </tr>
            <tr>
                <td>01</td>
                <td>Sam</td>
                <td>O+</td>
            </tr>
            <tr>
                <td>02</td>
                <td bgcolor="LightBlue">John</td>
                <td>A-</td>
            </tr>
            <tr>
                <td>03</td>
                <td>Bob</td>
                <td>A+</td>
            </tr>
           
        </table>
        <h1>List</h1>
        <h3>Ordered List</h3>
        <ol>
            <li>Milk</li>
            <li>Egg</li>
            <li>Fish</li>
            <li>Meat</li>
        </ol>
        <h3>Unordered List</h3>
        <ul>
            <li>The Statue of Liberty</li>
            <li>The Great Wall of China</li>
            <li>Taj Mahal</li>
        </ul>
    </body>
</html>
