<!DOCTYPE html>
<html>
    <head>
        <title>Media in HTML</title>
    </head>
    <body>
        <h1> Adding an Image</h1>
        <img src="images.webp" alt="Bachira" width="300px"> 
        <h1>Adding an Audio</h1>
        <audio controls>
            <source src="short-20-447126.mp3"
            type="audio/mpeg">
        </audio>
        <video controls width="300px">
            <source src="Cat.mp4" type="video/mp4">
        </video>
        <h1>Adding an Iframe</h1>
        <iframe width="300px" height="300px" src="https://www.youtube.com/embed/9iDXWx7GtZQ?si=ydMEF4gpofwjtCyT"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    </body>
</html>
